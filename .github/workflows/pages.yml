name: Update and deploy Pages

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '23 21 * * *' # 매일 06:23 KST (실행 지연 가능)
  workflow_dispatch:
    inputs:
      sync:
        description: 원본 데이터도 갱신
        type: boolean
        default: true

permissions:
  contents: read

# Serialize updates and deployments; never cancel an in-progress data commit.
concurrency:
  group: pages-${{ github.event_name == 'pull_request' && github.ref || 'production' }}
  cancel-in-progress: false

jobs:
  update:
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.sync)
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Checkout upstream data (never execute upstream code)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: hyunbinseo/holidays-kr
          ref: main
          path: .upstream
          persist-credentials: false
          sparse-checkout: public
      - run: node --test scripts/pages.test.mjs
      - run: node scripts/pages.mjs sync .upstream/public
      - run: node scripts/pages.mjs build
      - name: Commit only validated data changes
        run: |
          git add public src/holidays src/anniversaries.ts
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            upstream_sha=$(git -C .upstream rev-parse HEAD)
            git commit -m "chore: sync holiday data from ${upstream_sha}"
            git push origin HEAD:main
          fi

  build:
    needs: update
    if: >-
      always() && !cancelled() &&
      (needs.update.result == 'success' || needs.update.result == 'skipped')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Bot pushes do not trigger another workflow: build the updated branch here.
          ref: ${{ github.event_name == 'pull_request' && github.ref || 'main' }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          package-manager-cache: false
      - run: node --test scripts/pages.test.mjs
      - run: node scripts/pages.mjs build
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        if: github.event_name != 'pull_request'
        with:
          path: _site

  deploy:
    needs: build
    if: >-
      always() && !cancelled() && needs.build.result == 'success' &&
      github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
